<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Hello, Website</h1>

    <p id="response" aria-live="polite"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
